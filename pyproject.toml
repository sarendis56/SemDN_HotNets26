[project]
name = "scdn"
version = "0.1.0"
description = "Experiments for the Semantics Delivery Network (SemDN, HotNets '26)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vllm>=0.8",
    "transformers>=4.51",
    "datasets>=3.0",
    "huggingface-hub[hf_transfer]>=0.30",
    "faiss-cpu>=1.9",
    "numpy>=1.26",
    "orjson",
    "requests",
    "fastapi",
    "uvicorn",
    "matplotlib>=3.9",
    "trafilatura>=2.0",
    "playwright>=1.49",
]

[dependency-groups]
dev = [
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scdn"]

[tool.ruff]
line-length = 100
target-version = "py311"
